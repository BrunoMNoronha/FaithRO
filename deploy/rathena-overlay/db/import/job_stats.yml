# FaithRO - Laos Deos - override versionado (ETAPA 2N-C, issue #8)
#
# Fonte versionada. Destino na VPS: /opt/faithro/rathena/db/import/job_stats.yml
# Cadeia de importacao (commit auditado 7f080871c):
#   db/job_stats.yml -> db/pre-re/job_exp.yml -> db/import/job_stats.yml (por ultimo, sobrescreve)
# NAO usar db/import/job_exp.yml: nao pertence a cadeia de importacao validada.
#
# Este override altera SOMENTE MaxBaseLevel (99 -> 255) e a tabela BaseExp a
# partir do nivel 99, para os dois grupos de Base EXP do Pre-Renewal. Os demais
# campos do grupo (limite de job level, tabela de job EXP, HP/SP, etc.) sao
# preservados pelo merge por classe e NAO sao redefinidos aqui.
# Curva de Base EXP: Curva B (Intermediaria) aprovada na ETAPA 2N-B.
# Semantica: Level L = EXP para avancar de L para L+1; Level 255 = sentinela do cap.
# NAO habilita 3a/4a classe nem cria caminhos de troca de classe (issue #9).
#
# Grupo 1: classes nao-trans (1a, 2a, expandidas, baby, Taekwon/SG/SL).
# Grupo 2: classes trans (rebirth).
