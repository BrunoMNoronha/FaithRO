name: Validate beam first build plan

on:
  push:
    branches: [ main, dev ]
    paths:
      - 'client/patcher/beam-audit/first-build-plan.example.json'
      - 'client/patcher/beam-audit/schemas/first-build-plan.schema.json'
      - 'client/patcher/beam-audit/upstream-manifest.example.json'
      - 'client/patcher/beam-audit/build-plan.example.json'
      - 'scripts/validate-beam-first-build-plan.py'
      - '.github/workflows/validate-beam-first-build-plan.yml'
  pull_request:
    branches: [ main, dev ]
    paths:
      - 'client/patcher/beam-audit/first-build-plan.example.json'
      - 'client/patcher/beam-audit/schemas/first-build-plan.schema.json'
      - 'client/patcher/beam-audit/upstream-manifest.example.json'
      - 'client/patcher/beam-audit/build-plan.example.json'
      - 'scripts/validate-beam-first-build-plan.py'
      - '.github/workflows/validate-beam-first-build-plan.yml'

permissions:
  contents: read

jobs:
  validate-first-build-plan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate first build plan (offline; no Rust, no build)
        run: |
          python scripts/validate-beam-first-build-plan.py
