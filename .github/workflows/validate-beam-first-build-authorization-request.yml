name: Validate beam first build authorization request

on:
  push:
    branches: [ main, dev ]
    paths:
      - 'client/patcher/beam-audit/first-build-authorization-request.example.json'
      - 'client/patcher/beam-audit/first-build-runbook.example.json'
      - 'client/patcher/beam-audit/first-build-authorization.example.json'
      - 'client/patcher/beam-audit/schemas/first-build-authorization-request.schema.json'
      - 'scripts/validate-beam-first-build-authorization-request.py'
      - '.github/workflows/validate-beam-first-build-authorization-request.yml'
  pull_request:
    branches: [ main, dev ]
    paths:
      - 'client/patcher/beam-audit/first-build-authorization-request.example.json'
      - 'client/patcher/beam-audit/first-build-runbook.example.json'
      - 'client/patcher/beam-audit/first-build-authorization.example.json'
      - 'client/patcher/beam-audit/schemas/first-build-authorization-request.schema.json'
      - 'scripts/validate-beam-first-build-authorization-request.py'
      - '.github/workflows/validate-beam-first-build-authorization-request.yml'

permissions:
  contents: read

jobs:
  validate-first-build-authorization-request:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate authorization request (offline; no Rust, no build, still unauthorized)
        run: |
          python scripts/validate-beam-first-build-authorization-request.py
